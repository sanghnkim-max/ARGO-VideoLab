[workspace]
resolver = "3"
members = ["crates/lab-api", "crates/lab-script", "crates/lab-mcp", "crates/videolab-core", "crates/videolab-ffi", "crates/videolab-cli", "tools/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

# FilmCraft is consumed as-is, as Cargo git dependencies pinned by rev (here AND in Cargo.lock,
# seeded from FilmCraft's own lock): never vendored, never forked — the ARGO-Workspace rule for the
# craft engines, as ImageLab does with PhotoCraft. Its `filmcraft-cli` (a binary-only package) is
# built from cargo's checkout of the same rev by tools/build-filmcraft-cli.sh.
#
# Pinned to db60ee4 (FilmCraft main, 2026-11-11).
[workspace.dependencies]
lab-api = { path = "crates/lab-api" }
lab-script = { path = "crates/lab-script" }
lab-mcp = { path = "crates/lab-mcp" }
videolab-core = { path = "crates/videolab-core" }
filmcraft-engine = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-automation = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-gpu = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-export = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-platform = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-render = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-project = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-time = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-isobmff = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-color = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-frame = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }
filmcraft-audio-dsp = { git = "https://github.com/storytold/filmcraft", rev = "db60ee45c2f5a5a125f26e4f6fc5de0b74fb811b" }

# rmcp and tokio at the versions FilmCraft's lock resolves (rmcp 3.6), plus the streamable-HTTP
# server transport, which FilmCraft's stdio-only server does not enable.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-streamable-http-server", "transport-async-rw"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.31", features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# The core copies 4K frames per playback frame (hardware decoder output): optimized even in debug
# builds, like the dependencies.
[profile.dev.package.videolab-core]
opt-level = 3

# Shipped in the APK. Unwinding stays on: the FFI turns a panic into a Kotlin exception.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
